name: Cron 15 min

# Vercel Hobby tillader kun daglige crons. Dette workflow kalder
# sync-endpoints hvert 15. minut i stedet.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync-podio-outcomes:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Podio meeting outcomes → Allio
        env:
          TOKEN: ${{ secrets.PODIO_WEBHOOK_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "${CRON_SECRET:-}" ]; then
            curl -fsS -H "Authorization: Bearer ${CRON_SECRET}" \
              "https://allio-leads.vercel.app/api/cron/sync-podio-outcomes?limit=50"
          elif [ -n "${TOKEN:-}" ]; then
            curl -fsS \
              "https://allio-leads.vercel.app/api/cron/sync-podio-outcomes?limit=50&token=${TOKEN}"
          else
            echo "Mangler secret PODIO_WEBHOOK_SECRET eller CRON_SECRET" >&2
            exit 1
          fi
